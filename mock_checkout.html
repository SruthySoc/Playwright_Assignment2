
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mock Checkout Form</title>
</head>
<body>
    <h1>Mock Checkout</h1>

    <form id="checkoutForm">
        <section id="step1">
            <h2>Step 1: Contact Details</h2>

            <label for="name">Test Name:</label>
            <input id="name" name="name" value="Test User">

            <label for="email">Test Email:</label>
            <input id="email" name="email"
                   value="test@example.com">

            <button type="button" id="next">Continue</button>
        </section>

        <section id="step2" hidden>
            <h2>Step 2: Delivery Details</h2>

            <label for="address">Test Address:</label>
            <input id="address" name="address"
                   value="123 Test Street">

            <label for="city">Test City:</label>
            <input id="city" name="city" value="Test City">

            <button type="button" id="back">Back</button>
            <button type="button" id="finish">Finish Demo</button>
        </section>

        <p id="message" aria-live="polite"></p>
    </form>

    <script>
        const step1 = document.getElementById("step1");
        const step2 = document.getElementById("step2");

        document.getElementById("next").onclick = () => {
            step1.hidden = true;
            step2.hidden = false;
        };

        document.getElementById("back").onclick = () => {
            step2.hidden = true;
            step1.hidden = false;
        };

        document.getElementById("finish").onclick = () => {
            document.getElementById("message").textContent =
                "Demo completed. No order was submitted.";
        };
    </script>
</body>
</html>
